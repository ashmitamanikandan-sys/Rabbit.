<!doctype html>
<html lang="en"><head><script>window.location.replace("./?tab=genres");</script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#08070b"><title>Discover — RABBIT</title>
<style>
:root{color-scheme:dark;--bg:#08070b;--panel:#17131e;--accent:#c5a8ff;--muted:#b8aec3}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f8f4ff;font:15px/1.5 system-ui,-apple-system,sans-serif}a{color:inherit;text-decoration:none}button{cursor:pointer;font:inherit}header{position:sticky;top:0;background:#08070bf2;backdrop-filter:blur(12px);border-bottom:1px solid #32283e;padding:17px max(18px,calc((100vw - 850px)/2));display:flex;align-items:center;justify-content:space-between;z-index:2}header strong{letter-spacing:2px;font-size:19px}header span{color:var(--accent)}main{max-width:850px;margin:auto;padding:32px 18px 100px}h1{font-size:clamp(32px,7vw,54px);line-height:1.1;margin:0 0 8px;letter-spacing:-2px}p{color:var(--muted)}.eyebrow{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--accent);font-weight:700}.filters{display:flex;gap:9px;overflow-x:auto;padding:15px 0 24px}.filters button{white-space:nowrap;background:#201a29;color:#e4d8f0;border:1px solid #3b304a;border-radius:25px;padding:9px 14px}.filters button[aria-pressed=true]{background:var(--accent);color:#130b20;font-weight:700}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}.book{border:1px solid #32283e;background:var(--panel);border-radius:15px;padding:16px;min-width:0}.book img{width:92px;height:135px;object-fit:cover;border-radius:5px;background:#282333}.book h2{font-size:18px;line-height:1.2;margin:12px 0 5px}.book p{font-size:13px;margin:0 0 12px}.book button{border:1px solid #66567a;background:none;color:#f7f1ff;padding:8px 11px;border-radius:8px}.book button[aria-pressed=true]{border-color:var(--accent);color:var(--accent)}.empty{padding:35px 20px;border:1px solid #44334f;border-radius:16px;background:#17131e}#more{display:block;margin:28px auto;border:0;border-radius:12px;padding:12px 24px;background:var(--accent);color:#170c20;font-weight:800}#more[hidden]{display:none}#status{min-height:22px}input{width:100%;padding:13px 16px;border:1px solid #51405f;border-radius:12px;background:#17131e;color:white;margin:15px 0 0}input:focus{outline:2px solid var(--accent)}.summary{white-space:pre-wrap;line-height:1.6;color:#ddd1e8;font-size:13px;margin-top:12px}
</style></head><body><header><a href="./" aria-label="RABBIT home"><strong>RABBIT<span>.</span></strong></a><a href="./">← Home</a></header><main><div class="eyebrow">FOLLOW YOUR CURIOSITY</div><h1>Find your next <span style="color:var(--accent)">rabbit hole.</span></h1><p>Discover books and follow the ideas that stay with you.</p><label for="search" class="eyebrow">Search the library</label><input id="search" type="search" placeholder="Search titles and authors" autocomplete="off"><div class="filters" id="filters" aria-label="Genres"></div><p id="status" role="status" aria-live="polite"></p><div class="grid" id="results"></div><button id="more" hidden>Discover more ↓</button></main>
<script src="./rabbit-config.js"></script>
<script>
"use strict";
const config=window.RABBIT_CONFIG||{},base=(config.supabaseUrl||"").replace(/\/$/,""),key=config.supabaseAnonKey||"";
const filters=document.getElementById("filters"),results=document.getElementById("results"),status=document.getElementById("status"),more=document.getElementById("more"),search=document.getElementById("search");
let genres=[],selected="",page=0,busy=false,finished=false,generation=0;
const pageSize=24;
const saved=new Set(JSON.parse(localStorage.getItem("rabbit_catalog_saved")||"[]"));
function node(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e}
function setStatus(message){status.textContent=message}
function headers(){return {apikey:key,Authorization:"Bearer "+key,Accept:"application/json"}}
async function api(path){const response=await fetch(base+"/rest/v1/"+path,{headers:headers()});if(!response.ok)throw Error("Catalog request failed ("+response.status+")");return response.json()}
function renderFilters(){filters.replaceChildren();for(const item of [{id:"",name:"All books"},...genres]){const b=node("button","",item.name);b.type="button";b.setAttribute("aria-pressed",String(selected===item.id));b.addEventListener("click",()=>{selected=item.id;renderFilters();reset()});filters.append(b)}}
function renderBook(book){const article=node("article","book");if(book.cover_url&&/^https:\/\//.test(book.cover_url)){const img=node("img");img.src=book.cover_url;img.alt="Cover of "+book.title;img.loading="lazy";img.referrerPolicy="no-referrer";article.append(img)}article.append(node("h2","",book.title||"Untitled"),node("p","",book.author||"Unknown author"));if(book.original_summary){article.append(node("div","summary",book.original_summary))}const btn=node("button","",saved.has(book.id)?"Saved ✓":"Save book");btn.type="button";btn.setAttribute("aria-pressed",String(saved.has(book.id)));btn.addEventListener("click",()=>{if(saved.has(book.id))saved.delete(book.id);else saved.add(book.id);localStorage.setItem("rabbit_catalog_saved",JSON.stringify([...saved]));btn.textContent=saved.has(book.id)?"Saved ✓":"Save book";btn.setAttribute("aria-pressed",String(saved.has(book.id)))});article.append(btn);return article}
function escapedLike(s){return s.replace(/[%,()*.]/g,c=>({",":"%2C","%":"%25","(":"%28",")":"%29","*":"%2A",".":"%2E"}[c]))}
async function load(){if(busy||finished)return;busy=true;const token=generation;more.hidden=true;setStatus("Finding books…");try{let filter="catalog_status=eq.ready";const q=search.value.trim();if(q)filter+="&or=(title.ilike.*"+encodeURIComponent(escapedLike(q))+"*,author.ilike.*"+encodeURIComponent(escapedLike(q))+"*)";if(selected){const links=await api("book_genres?select=book_id&genre_id=eq."+encodeURIComponent(selected)+"&limit=10000");if(token!==generation)return;const ids=links.map(x=>x.book_id);if(!ids.length){finished=true;setStatus("No published books in this genre yet.");return}filter+="&id=in.("+ids.map(encodeURIComponent).join(",")+")"}const books=await api("books?select=id,title,author,cover_url,original_summary&"+filter+"&order=created_at.desc&limit="+pageSize+"&offset="+(page*pageSize));if(token!==generation)return;for(const book of books)results.append(renderBook(book));page++;finished=books.length<pageSize;setStatus(results.children.length?results.children.length+" books discovered"+(finished?"":" · keep exploring"):"No published books match yet. Check back soon.");more.hidden=finished}catch(error){if(token===generation)setStatus("The catalog couldn't load. Please try again later.");console.error(error)}finally{busy=false;if(token===generation&&!finished&&results.children.length)more.hidden=false}}
function reset(){generation++;busy=false;finished=false;page=0;results.replaceChildren();load()}
more.addEventListener("click",load);let delay;search.addEventListener("input",()=>{clearTimeout(delay);delay=setTimeout(reset,300)});
(async()=>{if(!/^https:\/\/[a-z0-9-]+\.supabase\.co$/.test(base)||!key){setStatus("The RABBIT catalog is being connected. Come back soon.");return}try{genres=await api("genres?select=id,name&order=name.asc");renderFilters();reset()}catch(error){console.error(error);setStatus("Catalog connection unavailable right now.")}})();
</script></body></html>
