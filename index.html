/* RABBIT editorial typography: elegant reading copy, crisp social controls */
:root{--reading-font: "Iowan Old Style","Baskerville","Palatino Linotype",Palatino,Georgia,serif}
.insight,.teaser,.reader p:not(.muted),.home-first .feature p{
  font-family:var(--reading-font);
  font-size:16px;
  line-height:1.68;
  letter-spacing:.04px;
  font-weight:400;
}
.postbody h2,.reader h1,.welcome h1{
  font-family:var(--reading-font);
  font-weight:600;
  letter-spacing:-.6px;
}
.postbody h2{font-size:27px;line-height:1.14}
.reader h1{font-size:38px;line-height:1.13}
.welcome h1{letter-spacing:-1.8px}

}
.reader p:not(.muted){font-size:18px;line-height:1.83}
@media(max-width:380px){.insight,.teaser,.home-first .feature p{font-size:15px}}
.wordmark{align-items:center;gap:0;letter-spacing:-1.3px}
.rabbit-b{display:inline-block;vertical-align:middle;margin:0 -1px 0 -1px;overflow:visible;transform-origin:50% 85%;animation:rabbit-ear-twitch 6s ease-in-out infinite}
.rabbit-b.second{animation-delay:1.3s}
.rabbit-b .b-glyph{fill:var(--ink)}

[2,'How Your Habits Shape Your Identity','The person you become is built through repeated choices.','A goal describes an outcome, but an identity describes who you believe you are.\nWhen people want to read more, they often set a target such as finishing twelve books.\nThat target can help, but it does not explain how reading becomes a natural part of their day.\nAn identity-based approach asks a different question: what would a reader do today?\nThe answer might be opening a book for five minutes after breakfast.\nThat small action gives you evidence that reading is something you actually do.\nOne action will not transform your self-image overnight.\nBut repeated evidence can make a new identity feel increasingly believable.\nThe same principle applies to exercising, writing, practicing music, or learning a language.\nChoose a small behavior that reflects who you want to become, and repeat it.','Instead of saying “I want to finish ten books,” try “I am becoming someone who reads every day.” Then make the first action so small you can repeat it.'],
[8,'How to Make a Habit Irresistible','Motivation is easier when the activity itself feels appealing.','Many good habits fail because their rewards seem distant while their effort is immediate.\nExercise may improve health later, but getting out of bed is difficult right now.\nOne strategy is to pair a necessary habit with something you already enjoy.\nFor example, you might listen to your favorite playlist only while taking a walk.\nThe enjoyable part makes starting feel less like a punishment.\nYour surroundings also influence which actions look attractive.\nWhen your friends regularly discuss books, reading can feel like a shared activity.\nWhen your phone is the first thing you see, scrolling becomes the obvious choice.\nYou cannot rely on enthusiasm to appear at the right moment every day.\nMake the behavior appealing before you need motivation, not after it disappears.','Pair a useful action with something enjoyable and make its starting point inviting.'],
[11,'Walk Slowly, but Never Backward','Repetition makes a behavior easier to perform.','Learning a skill is rarely a straight line from confusion to mastery.\nAt first, even a simple task requires deliberate attention.\nThink about typing: beginners search for every key, while experienced typists barely think about it.\nThat difference develops through repeated practice, not one perfect session.\nHabits follow a similar pattern as familiar actions become less mentally demanding.\nPeople sometimes delay beginning because they want the ideal plan.\nBut designing a flawless schedule is not the same as actually practicing.\nA short session repeated regularly can be more useful than a complicated plan never followed.\nMistakes are information about what needs adjustment, not proof that progress is impossible.\nStart with a manageable repetition and improve the process as you go.','Measure how often you practice, not how perfect each attempt feels.']]},

[3,'Never Enough','Knowing what is enough protects you from endless comparison.','Imagine someone reaches the salary they once considered a dream.\nA year later, their peers earn more, and the same salary suddenly feels disappointing.\nThe numbers have not changed, but the comparison has.\nThis is one reason financial satisfaction cannot depend only on earning more.\nIf the definition of success keeps moving, achievement never feels complete.\nAmbition can be useful, but endless comparison can push people into unnecessary risks.\nThe pursuit of a slightly better outcome can threaten what they already value.\nA personal definition of enough creates a boundary around that temptation.\nIt might mean being able to pay bills, help family, and control some of your time.\nThe useful question is not only “How much more can I get?” but “What is worth protecting?”','Write down what financial security would allow you to do, rather than measuring success only against other people.'],
[7,'Freedom','Control over your time can be more valuable than appearances.','Two people may earn similar amounts and live very different lives.\nOne spends almost everything to maintain an impressive lifestyle.\nThe other saves enough to have choices about work, rest, and unexpected problems.\nThe first may own more visible things, but the second may have more flexibility.\nMoney can buy products, experiences, and convenience.\nIt can also create room to say no to obligations that do not fit your priorities.\nThat kind of freedom is difficult to photograph or display online.\nIt is easy to underestimate because it does not always look impressive.\nYet being able to choose how you spend an afternoon can improve everyday life.\nThink of saving as purchasing future options, not simply accumulating a number.','Ask whether a purchase gives you lasting freedom or only a brief sense of status.'],
[13,'Room for Error','A good plan leaves space for life to surprise you.','A plan can be sensible and still fail because the future is uncertain.\nA student may expect a project to take three days, only to lose a day to illness.\nA household may budget carefully and still face an unexpected repair.\nIf a plan requires everything to go perfectly, even a small surprise becomes a crisis.\nA margin of safety makes the same surprise easier to handle.\nIn daily life, that might mean leaving extra time before a deadline.\nIn finances, it might mean keeping money available for emergencies.\nThis is not pessimism or an expectation that everything will go wrong.\nIt is acknowledging that no one can predict every interruption.\nThe strongest plans are often the ones that can bend without breaking.','Add a buffer to your time, money, and commitments instead of planning for a flawless week.']]},

[2,'Happiness Is a Problem','A meaningful life does not require feeling good every minute.','People often imagine happiness as a state where difficulties finally disappear.\nBut solving one problem usually introduces another set of choices.\nA student who works hard to enter a new school may then worry about fitting in.\nSomeone who gets a dream job may discover the stress of new responsibilities.\nThis does not mean the achievements were pointless.\nIt means a worthwhile life still contains uncertainty, effort, and discomfort.\nThe more useful question is which problems you are willing to work through.\nLearning a language is frustrating, but that frustration may be worth the skill.\nCaring for a friendship requires difficult conversations, but they can deepen trust.\nInstead of trying to eliminate every struggle, choose struggles connected to your values.','Ask “Which difficulties are worth facing for something I care about?”'],
[7,'Failure Is the Way Forward','Small failures can reveal the next useful action.','Fear of failure can make beginning feel more dangerous than doing nothing.\nA person might avoid posting their art because the first attempt may not impress anyone.\nBut avoiding feedback also prevents them from learning what works.\nA rough draft reveals problems that an unwritten idea cannot reveal.\nThe first attempt is useful because it turns uncertainty into information.\nYou can notice what confused people, what took too long, and what deserves improvement.\nThis does not make every failure pleasant or automatically valuable.\nIt becomes valuable when you reflect and adjust your approach.\nProgress often looks like a series of imperfect experiments.\nStart with something small enough that a mistake is manageable.','Create a first version, learn from its weaknesses, and revise instead of waiting to feel ready.'],
[8,'The Importance of Saying No','Boundaries make commitments meaningful.','Saying yes to everything can feel kind and generous at first.\nBut time, energy, and attention are limited resources.\nAgreeing to every invitation can leave no room for studying, rest, or close relationships.\nA boundary is not necessarily a rejection of another person.\nIt is an honest statement about what you can realistically give.\nWithout boundaries, even the things you love can become exhausting.\nA clear no can prevent resentment that develops after an unwilling yes.\nIt also helps others understand what to expect from you.\nThe goal is not to become indifferent to everyone else.\nIt is to make your yes more genuine by using it deliberately.','Before agreeing, ask what you would have to give up to make room for the commitment.']]},

[1,'Never Outshine the Master','Understanding status can help you navigate group dynamics.','People do not always respond to an idea based only on its quality.\nThey also notice who presented it, who received credit, and how it affects their status.\nIn a team, publicly embarrassing a leader may make a useful suggestion harder to accept.\nThat does not mean you should hide your abilities or flatter people dishonestly.\nIt means timing and delivery can influence whether your message is heard.\nYou might raise a disagreement privately or acknowledge another person’s contribution.\nThis can preserve dignity while still allowing honest discussion.\nThe danger is turning every interaction into a competition for approval.\nHealthy teams should welcome good ideas regardless of rank.\nRead this law as an observation about insecurity, not a rule for unquestioning obedience.','Present ideas with respect for others while keeping your judgment and integrity.'],
[4,'Always Say Less Than Necessary','Restraint can make communication clearer.','When people feel nervous, they sometimes keep talking to fill every silence.\nExtra explanations can bury the point they originally wanted to make.\nImagine answering a straightforward interview question with five unrelated stories.\nThe listener may remember the confusion rather than the strongest example.\nA shorter answer can be more memorable because it gives the main idea room.\nPausing also lets you notice how another person responds.\nBut silence is not always wisdom, and withholding important information can damage trust.\nThe useful lesson is to choose words deliberately rather than perform mystery.\nClarity matters more than appearing powerful.\nTry expressing your main point in one sentence before adding necessary detail.','Say what matters clearly, then stop when the message is complete.'],
[9,'Win Through Your Actions, Never Through Argument','Evidence often persuades better than endless debate.','People can defend a position more strongly when they feel attacked.\nAn argument may become about winning rather than understanding the issue.\nSuppose two teammates disagree about which design is easier to use.\nThey could spend an hour repeating their preferences.\nOr they could test both versions with a few real users.\nThe test may reveal problems neither person predicted.\nA visible result can move the conversation from ego toward evidence.\nOf course, actions do not replace discussion when ethics or safety are involved.\nAnd one experiment does not prove a universal truth.\nStill, when a disagreement can be tested fairly, demonstration can be more productive than repetition.','Where possible, replace an opinion battle with a small, honest experiment.']]},

[1,'Communication Happens on the Listener’s Terms','A message succeeds only when someone can understand it.','You may explain something clearly in your own mind and still confuse another person.\nDifferent listeners have different experiences, vocabulary, and expectations.\nA technical explanation that works for a specialist may overwhelm a beginner.\nA very short instruction may feel efficient to one person but abrupt to another.\nGood communication starts by considering what the listener already knows.\nIt can help to use a concrete example before introducing unfamiliar terminology.\nQuestions are also useful because they reveal what the other person understood.\nThe goal is not to change your entire personality for every conversation.\nIt is to make the message accessible without losing its meaning.\nBe cautious about reducing people to rigid personality labels; individuals are more complex.','Before explaining, ask what context your listener needs to understand the point.'],
[8,'Strengths and Weaknesses','The same trait can help in one situation and hinder another.','Being detail-oriented can prevent mistakes in an important report.\nThat same attention to detail can slow down a decision that needs to be made quickly.\nBeing spontaneous can help someone adapt to a sudden change.\nBut spontaneity may also create problems when careful preparation is required.\nTraits are not always simply good or bad.\nTheir usefulness often depends on the situation and how they are expressed.\nIt is tempting to sort people into neat categories because categories feel simple.\nBut real behavior changes across contexts and relationships.\nA better approach is to notice specific patterns rather than assign a permanent label.\nThen ask which strengths a situation needs and where support might help.','Describe behaviors in context instead of assuming a personality label explains everything.'],
[10,'Body Language','Nonverbal cues are clues, not mind-reading tools.','Someone crosses their arms during a conversation.\nIt is tempting to conclude that they are defensive or uninterested.\nBut they might simply be cold, tired, or comfortable in that position.\nBody language can add context to what people say, but one gesture rarely proves an emotion.\nTone, timing, cultural norms, and the surrounding situation also matter.\nA person avoiding eye contact may be nervous, concentrating, or following a cultural habit.\nTreating a single cue as certain evidence can create unnecessary misunderstandings.\nLook for patterns and listen to the person’s words.\nWhen something seems unclear, asking respectfully is often better than guessing.\nCuriosity about another person beats confidence in an untested interpretation.','Use nonverbal behavior as a reason to ask, not as proof that you know what someone thinks.']]}];
const teasers={"atomic-2": "What if your habits aren't just things you do, but tiny votes for who you believe you are? Reading one page won't transform your life overnight. But doing it again tomorrow gives your brain evidence: I'm someone who reads. Goals tell you where you want to go; repeated actions quietly shape who you become. Here's the surprising part: you don't have to feel like a different person before you start acting like one.", "atomic-8": "Ever noticed how you can spend an hour scrolling but struggle to study for ten minutes? Your brain isn't simply choosing what's important. It's drawn toward what feels rewarding right now. One way to change a habit is to make its starting point more appealing, not just demand more willpower. A small shift in how you pair activities can change what you actually look forward to. But what happens when the reward disappears?", "atomic-11": "Why does something that once felt impossible eventually become automatic? Think about the first time you learned to type, ride a bike, or cook. Progress didn't come from one perfect attempt. It came from repetition that made each movement a little less demanding. We often obsess over finding the best method before beginning. But your brain may need a different thing first: enough attempts to stop treating the action as unfamiliar.", "money-3": "Imagine finally earning the amount you once dreamed about—and somehow feeling poorer than before. Nothing changed except who you compare yourself with. The goalposts can move so quietly that success stops feeling like success. Morgan Housel's idea of 'enough' asks a difficult question: how much is genuinely useful to you, and how much is a race you never agreed to run?", "money-7": "Two people can earn the same salary and live completely different lives. One has expensive things but almost no room to say no. The other has fewer luxuries and the freedom to change plans, rest, or walk away. Money can buy objects, but it can also buy control over your time. Which of those feels more valuable once you actually have it?", "money-13": "A plan can look flawless on paper and still fall apart on Tuesday. A surprise expense, an illness, one delayed deadline—and suddenly the whole system breaks. The mistake isn't always planning badly. Sometimes it's leaving no space for reality to be unpredictable. A little margin can make the difference between a setback and a disaster. So why do we keep designing plans that require everything to go right?", "subtle-2": "What if happiness isn't a life without problems? You get into the school you wanted, then worry about fitting in. You reach a goal, then find a harder one waiting. That doesn't make the achievement meaningless. It might mean the better question is not 'How do I avoid difficulty?' but 'Which difficulties are worth choosing?' The answer can change what you chase.", "subtle-7": "The fear of looking bad at something can stop you from ever getting good at it. You don't post your work, try out for a team, or speak up because the first attempt might be awkward. But avoiding failure also means avoiding information. A small imperfect attempt can tell you more than a month of overthinking. What would you try if your first version didn't have to impress anyone?", "subtle-8": "Every yes quietly spends something: time, energy, attention. When you agree to everything, the things you truly care about start competing for scraps. Saying no can feel uncomfortable because someone might be disappointed. But a boundary isn't necessarily rejection; sometimes it's how you protect a meaningful yes. The interesting question is what your calendar says you value—not just what you claim to value.", "power-1": "Why can a brilliant idea land badly just because of who says it? People don't respond only to facts. Status, insecurity, and the need for recognition can shape the room. Robert Greene frames this as a law of power, but there's a more useful question underneath: how do you contribute confidently without turning every conversation into a contest for credit?", "power-4": "Have you ever explained something so much that your original point disappeared? Silence can feel awkward, especially when you're nervous. So you keep adding reasons, examples, and apologies until a clear message becomes a maze. Speaking less isn't about playing mysterious games. Sometimes it's about trusting one precise sentence to do its job. When is another explanation actually making things worse?", "power-9": "Two people argue for twenty minutes, and neither changes their mind. Then a small demonstration settles the question in thirty seconds. When someone feels challenged, they may defend their position more fiercely—even against good evidence. Actions can sometimes make an idea visible without making the other person feel defeated. But there's a difference between proving a point and understanding someone.", "idiots-1": "You've explained something perfectly, yet the other person looks confused. The words made sense to you—so what went wrong? Communication isn't just sending a message; it's noticing how it lands. What feels obvious to one person may be unfamiliar to another. Before deciding someone 'doesn't get it,' try changing the example, pace, or question. You might discover the problem wasn't the person at all.", "idiots-8": "Is being detail-oriented a strength or a weakness? It depends. In a medical report, it might prevent a serious mistake. In a quick brainstorm, it might slow everyone down. The same is true of spontaneity, caution, and confidence. Labels can make people seem simpler than they are. A more interesting way to understand someone is to ask: in what situation does this trait help—and when does it get in the way?", "idiots-10": "Someone crosses their arms while you speak. Are they annoyed, uncomfortable, cold, or just relaxed? Body language feels like a secret code, but real people don't come with a reliable dictionary of gestures. One movement rarely tells the whole story. Context, patterns, and what someone actually says matter more than a single pose. What if the most confident interpretations are sometimes the least accurate?"};

tElementById('homeScroll').scrollTop=readerHomePos}else renderFeed(active)}function toast(msg){document.querySelector('.toast')?.remove();const el=document.createElement('div');el.className='toast';el.textContent=msg;document.body.append(el);setTimeout(()=>el.remove(),1900)}function allPosts(){return books.flatMap(b=>b.chapters.map((c,i)=>({id:b.id+'-'+c[0],book:b,chapter:c,index:i})))}const posts=allPosts();function mixPosts(){let remaining=[...posts],order=[],prev='';while(remaining.length){let options=remaining.filter(p=>p.book.id!==prev);if(!options.length)options=remaining;const i=Math.floor(Math.random()*options.length),chosen=options[i];order.push(chosen.id);prev=chosen.book.id;remaining=remaining.filter(p=>p.id!==chosen.id)}return order}function postById(id){return posts.find(p=>p.id===id)}function cover(b){return `<img class="cover" src="${b.cover}" alt="Cover of ${b.title}" >`}function bookRow(b,chapter,withFollow=false){return `<div class="bookrow">${cover(b)}<div style="flex:1;min-width:0"><div class="postmeta">CHAPTER ${String(chapter[0]).padStart(2,'0')}</div><h3>${b.title}</h3><p>${b.author}</p>${withFollow?`<button class="outline ${followed.includes(b.id)?'following':''}" onclick="toggleFollow('${b.id}')">${followed.includes(b.id)?'Following ✓':'+ Follow book'}</button>`:''}</div></div>`}function renderWelcome(){screen='welcome';app.innerHTML=`<main class="page welcome"><div class="eyebrow">WELCOME TO RABBIT</div><div style="font-size:70px;margin-top:25px;color:var(--lilac)">↘</div><h1>Go down<br>the <span class="accent">rabbit hole.</span></h1><p>A feed of ideas worth getting lost in. Find your next obsession, one chapter at a time.</p><button class="primary" onclick="renderInterests()">Find your rabbit hole →</button><p class="subtle">Stories are everywhere. Follow your curiosity.</p></main>`}function renderInterests(){screen='interests';app.innerHTML=`<main class="page">${header(true)}<div class="interests"><div class="eyebrow">THE FIRST HOP / 01</div><h1>What pulls you in?</h1><p class="muted">Pick a rabbit hole. More worlds are opening soon.</p><div class="chips">${interests.map((t,i)=>`<button class="chip ${i===0?'active':''}" onclick="${i===0?'this.classList.toggle(\'active\')':'toast(\'Coming soon — try The Human Mind!\')'}">${t}</button>`).join('')}</div></div><div class="sticky-cta"><button class="primary" onclick="chooseInterest()">Enter the burrow →</button></div></main>`}function chooseInterest(){if(!document.querySelector('.chip.active')){toast('Select The Human Mind to continue');return}entered=true;save('entered',true);renderHome()}function dailyPost(b){const day=Math.floor(Date.now()/86400000);return b.chapters[day%b.chapters.length]}function renderHome(){screen='home';let display=followed.length?books.filter(b=>followed.includes(b.id)):books;let feature=postById('atomic-8');feedOrder=feedOrder.length?feedOrder:mixPosts();feedOrder=feedOrder.filter(x=>x!==feature.id);feedOrder.unshift(feature.id);const teaser=teasers[feature.id]||feature.chapter[2];app.innerHTML=`<div class="page home-scroll" id="homeScroll"><section class="home-first">${header()}<div class="home-body"><div class="stories">${display.map(b=>`<button class="story" onclick="openStory('${b.id}')"><img src="${b.cover}" alt="${b.title}" ><span>${b.title}</span></button>`).join('')}</div><div class="section" style="padding-top:4px"><div class="muted" style="font-size:11px;letter-spacing:1px">${followed.length?'FROM YOUR FOLLOWED BOOKS':'BOOK STORIES · FOLLOW YOUR FAVORITES'}</div><div class="section-head" style="margin-top:21px"><h2>For your curiosity <span class="accent">✦</span></h2><span class="muted" style="font-size:10px">THE HUMAN MIND</span></div><div class="feature">${bookRow(feature.book,feature.chapter,true)}<div class="eyebrow" style="margin-top:18px">THE FIRST HOP · 001</div><h3 style="font-size:23px;letter-spacing:-.5px;line-height:1.2;margin:10px 0">Why does your brain crave the habits you want to quit?</h3><p>${teaser}</p><div class="actions"><button class="${liked.includes(feature.id)?'active':''}" aria-label="Like" onclick="toggleHomeItem('liked','${feature.id}',this)">${ico('heart')}</button><button class="${saved.includes(feature.id)?'active':''}" aria-label="Save" onclick="toggleHomeItem('saved','${feature.id}',this)">${ico('bookmark')}</button><button class="readmore" style="margin-left:auto" onclick="renderReader(0)">Read more ↗</button></div><div class="subtle" style="margin-top:14px">↓ Scroll to fall deeper into the rabbit hole</div></div></div></div></section>${feedOrder.map((id,i)=>{const p=postById(id),b=p.book,c=p.chapter;return `<article class="feedpost" data-i="${i}">${header()}<div class="postbody"><div class="postmeta">THE HUMAN MIND · HOP ${String(i+1).padStart(2,'0')} / ${feedOrder.length}</div><div style="margin-top:13px">${bookRow(b,c,true)}</div><h2>${c[1]}</h2><div class="insight teaser">${teasers[id]||c[2]}</div><button class="readmore" onclick="renderReader(${i})">Read more ↗</button><div class="actions"><button class="${liked.includes(id)?'active':''}" aria-label="Like" onclick="toggleItem('liked','${id}',${i})">${ico('heart')}</button><button aria-label="Comments" onclick="toast('Comments are coming soon')">${ico('message')}</button><button aria-label="Share" onclick="toast('Sharing is coming soon')">${ico('send')}</button><button class="${saved.includes(id)?'active':''}" aria-label="Save" onclick="toggleItem('saved','${id}',${i})">${ico('bookmark')}</button></div><p class="muted" style="font-size:10px;margin:11px 0 0">Original chapter-inspired insight · Swipe for another book ↓</p></div></article>`}).join('')}</div><nav class="footnav"><button onclick="renderHome()" class="accent">${ico('home')}<div>Home</div></button><button onclick="enterFeed()">${ico('send')}<div>Explore</div></button><button onclick="renderSaved()">${ico('bookmark')}<div>Saved</div></button></nav>`;const f=document.getElementById('homeScroll');let timer;f.addEventListener('scroll',()=>{clearTimeout(timer);timer=setTimeout(()=>{active=Math.max(0,Math.round(f.scrollTop/f.clientHeight)-1)},90)},{passive:true})}
function toggleHomeItem(key,id,btn){let arr=key==='liked'?liked:saved;arr=arr.includes(id)?arr.filter(x=>x!==id):[...arr,id];save(key,arr);if(key==='liked')liked=arr;else saved=arr;btn.classList.toggle('active',arr.includes(id))}
function toggleFollow(id){followed=followed.includes(id)?followed.filter(x=>x!==id):[...followed,id];save('followed',followed);if(screen==='home'){const f=document.getElementById('homeScroll');const pos=f?.scrollTop||0;renderHome();document.getElementById('homeScroll').scrollTop=pos}else if(screen==='feed')renderFeed(active);else if(screen==='reader')renderReader(active)}function openStory(id){const b=books.find(b=>b.id===id);const c=dailyPost(b);enterFeed(id+'-'+c[0])}function enterFeed(startId){feedOrder=mixPosts();if(startId){feedOrder=feedOrder.filter(x=>x!==startId);feedOrder.unshift(startId)}renderFeed(0)}function renderFeed(idx=0){screen='feed';active=idx;app.innerHTML=`<div class="page feed" id="feed">${feedOrder.map((id,i)=>{const p=postById(id),b=p.book,c=p.chapter;return `<article class="feedpost" data-i="${i}">${header(true)}<div class="postbody"><div class="postmeta">THE HUMAN MIND · HOP ${String(i+1).padStart(2,'0')} / ${feedOrder.length}</div><div style="margin-top:13px">${bookRow(b,c,true)}</div><h2>${c[1]}</h2><div class="insight teaser">${teasers[id]||c[2]}</div><button class="readmore" onclick="renderReader(${i})">Read more ↗</button><div class="actions"><button class="${liked.includes(id)?'active':''}" aria-label="Like" onclick="toggleItem('liked','${id}',${i})">${ico('heart')}</button><button aria-label="Comments" onclick="toast('Comments are coming soon')">${ico('message')}</button><button aria-label="Share" onclick="toast('Sharing is coming soon')">${ico('send')}</button><button class="${saved.includes(id)?'active':''}" aria-label="Save" onclick="toggleItem('saved','${id}',${i})">${ico('bookmark')}</button></div><p class="muted" style="font-size:10px;margin:11px 0 0">Original commentary inspired by this chapter · Swipe for another book ↓</p></div></article>`}).join('')}</div>`;const f=document.getElementById('feed');f.scrollTop=idx*f.clientHeight;let timer;f.addEventListener('scroll',()=>{clearTimeout(timer);timer=setTimeout(()=>{active=Math.round(f.scrollTop/f.clientHeight)},75)},{passive:true})}function toggleItem(key,id,i){let arr=key==='liked'?liked:saved;arr=arr.includes(id)?arr.filter(x=>x!==id):[...arr,id];save(key,arr);if(key==='liked')liked=arr;else saved=arr;const section=document.querySelector(`.feedpost[data-i="${i}"]`);const btn=section?.querySelector(`button[aria-label="${key==='liked'?'Like':'Save'}"]`);if(btn)btn.classList.toggle('active',arr.includes(id))}function renderReader(i){if(screen!=='reader'){readerOrigin=screen==='home'?'home':'feed';readerHomePos=document.getElementById('homeScroll')?.scrollTop||0}screen='reader';active=i;const p=postById(feedOrder[i]),b=p.book,c=p.chapter;const other=b.chapters.filter(x=>x[0]!==c[0]);const similar=books.filter(x=>x.id!==b.id).slice(0,3);app.innerHTML=`<main class="page">${header(true)}<div class="reader"><div class="eyebrow">${b.title} / CHAPTER ${c[0]}</div><h1>${c[1]}</h1><p class="muted" style="font-size:13px">An original explanation inspired by ${b.author}'s book</p><div style="margin:23px 0">${bookRow(b,c,true)}</div><div class="insight" style="font-size:16px;line-height:1.85">${c[3]}</div><p>Think about where this idea shows up in your own life. The point isn't to memorize a slogan from a book, but to notice a pattern and try a small, thoughtful experiment.</p><p>One useful way to test the insight is to choose a situation you already face, write down what you usually do, and identify one change you could make this week. Notice what happens, and adjust rather than treating one attempt as a final verdict.</p><div class="takeaway"><div class="eyebrow">THE TAKEAWAY</div><p style="margin-bottom:0">${c[4]}</p></div><div class="actions" style="margin-top:25px"><button class="${liked.includes(p.id)?'active':''}" onclick="toggleReaderItem('liked')">${ico('heart')}</button><button class="${saved.includes(p.id)?'active':''}" onclick="toggleReaderItem('saved')">${ico('bookmark')}</button><button onclick="toast('Sharing is coming soon')">${ico('send')}</button></div><h3>Other chapters from this book</h3>${other.map(x=>`<button class="outline" style="display:block;width:100%;text-align:left;margin:9px 0;padding:14px" onclick="openRelated('${b.id}-${x[0]}')">Chapter ${x[0]} · ${x[1]} →</button>`).join('')}<h3>Similar discoveries</h3><div class="related">${similar.map(x=>`<button onclick="openRelated('${x.id}-${x.chapters[0][0]}')"><img src="${x.cover}" alt=""><div style="font-size:12px;margin-top:8px">${x.title}</div><small>Explore →</small></button>`).join('')}</div><button class="primary" onclick="backFromReader()">← Back to your rabbit hole</button></div></main>`}function toggleReaderItem(key){const id=feedOrder[active];let arr=key==='liked'?liked:saved;arr=arr.includes(id)?arr.filter(x=>x!==id):[...arr,id];save(key,arr);if(key==='liked')liked=arr;else saved=arr;renderReader(active)}function openRelated(id){let i=feedOrder.indexOf(id);if(i===-1){feedOrder.push(id);i=feedOrder.length-1}renderReader(i)}function renderSaved(){screen='saved';app.innerHTML=`<main class="page">${header(true)}<div class="section"><h2>Saved rabbit holes</h2>${saved.length?saved.map(id=>{const p=postById(id);return p?`<button class="outline" style="display:block;width:100%;text-align:left;margin:12px 0;padding:16px" onclick="enterFeed('${id}')">${p.book.title} · Chapter ${p.chapter[0]}<br><span class="muted">${p.chapter[1]}</span></button>`:''}).join(''):'<p class="empty">Save an insight in the feed and it will appear here.</p>'}</div></main>`}window.addEventListener('keydown',e=>{if((screen==='feed'||screen==='home')&&['ArrowDown','ArrowUp'].includes(e.key)){e.preventDefault();(()=>{const f=document.getElementById(screen==='home'?'homeScroll':'feed');const current=Math.round(f.scrollTop/f.clientHeight);f.scrollTo({top:Math.max(0,Math.min(feedOrder.length-(screen==='home'?0:1),current+(e.key==='ArrowDown'?1:-1)))*f.clientHeight,behavior:'smooth'})})()}});try{renderWelcome()}catch(err){console.error(err);document.getElementById('app').innerHTML='<main class="page welcome"><h1>RABBIT</h1><p>Could not load the app. Try refreshing or opening in Chrome.</p></main>'}
