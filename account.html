<!doctype html><html lang="en"><head><script>window.location.replace("./?tab=auth");</script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RABBIT · Account</title><style>*{box-sizing:border-box}body{margin:0;background:#08090b;color:#f6f3f9;font:15px -apple-system,BlinkMacSystemFont,Arial,sans-serif;min-height:100vh;display:grid;place-items:center;padding:20px}.box{max-width:450px;width:100%;background:#141519;border:1px solid #35313b;border-radius:23px;padding:32px}h1{font-size:36px;letter-spacing:-.05em;margin:10px 0}small{color:#bfa6e7;letter-spacing:.14em}p{color:#bdb8c5;line-height:1.6}input{display:block;width:100%;background:#0c0d10;border:1px solid #51465d;color:white;padding:14px;border-radius:12px;margin:12px 0}button{background:#c5a7f2;color:#16111c;border:0;border-radius:12px;padding:13px 18px;cursor:pointer;font-weight:700}button.alt{background:#29242f;color:#f5edff}#status{min-height:32px;color:#d5c4e5}.buttons{display:flex;gap:10px;flex-wrap:wrap}a{color:#cbb3f5}</style></head><body><main class="box"><small>RABBIT / FOLLOW YOUR CURIOSITY</small><h1>Your account ✦</h1><p>Sign up or sign in to your RABBIT account. Email confirmation may be required. Community posting is still in local demo mode until the database and permissions are deployed.</p><form id="auth"><input id="email" type="email" autocomplete="email" placeholder="Email address" required><input id="password" type="password" autocomplete="current-password" placeholder="Password (minimum 6 characters)" minlength="6" required><div class="buttons"><button type="submit" id="login">Sign in</button><button type="button" class="alt" id="signup">Create account</button><button type="button" class="alt" id="logout" hidden>Sign out</button></div></form><p id="status" role="status"></p><p><a href="./">← Home</a> · <a href="./clubs.html">Clubs</a> · <a href="./warren.html">Warren</a></p></main><script src="rabbit-config.js"></script><script type="module">
import {createClient} from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";
const cfg=window.RABBIT_CONFIG,status=document.getElementById("status");if(!cfg?.supabaseUrl||!cfg?.supabaseAnonKey){status.textContent="Authentication is not configured.";throw Error("Missing Supabase configuration")}
const sb=createClient(cfg.supabaseUrl,cfg.supabaseAnonKey),email=document.getElementById("email"),password=document.getElementById("password"),logout=document.getElementById("logout");
function say(s){status.textContent=s}
async function refresh(){const {data,error}=await sb.auth.getUser();if(data?.user){say("Signed in as "+data.user.email+". Shared communities are not enabled yet.");logout.hidden=false}else{say(error&&error.name!=="AuthSessionMissingError"?"Session unavailable. Please sign in.":"Not signed in.");logout.hidden=true}}
document.getElementById("auth").onsubmit=async e=>{e.preventDefault();say("Signing in…");const {error}=await sb.auth.signInWithPassword({email:email.value.trim(),password:password.value});if(error)say(error.message);else refresh()};
document.getElementById("signup").onclick=async()=>{if(!email.reportValidity()||!password.reportValidity())return;say("Creating account…");const {error,data}=await sb.auth.signUp({email:email.value.trim(),password:password.value});say(error?error.message:data.session?"Account created and signed in.":"Check your email to confirm your account, then sign in.");if(data?.session)refresh()};
logout.onclick=async()=>{await sb.auth.signOut();refresh()};refresh();
</script></body></html>
