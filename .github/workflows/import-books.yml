
name: RABBIT Book Importer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview-books:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Get RABBIT files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch and check books
        run: python scripts/import_books.py

      - name: Save book preview and quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rabbit-import-results
          path: |
            rabbit_books_preview.json
            rabbit_import_report.json
          if-no-files-found: warn
          retention-days: 7
