name: RABBIT Save Books to Supabase

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/save-books.yml'

permissions:
  contents: read

jobs:
  save-books:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Get RABBIT files
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch book candidates
        run: python scripts/import_books.py
      - name: Save books to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/save_to_supabase.py
      - name: Save import reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rabbit-save-results
          path: |
            rabbit_books_preview.json
            rabbit_import_report.json
          if-no-files-found: warn
          retention-days: 7
